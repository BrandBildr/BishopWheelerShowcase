<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>OG card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Libre+Caslon+Text:ital@1&family=Montserrat:wght@600;800&family=Space+Grotesk:wght@500;600&display=swap">
<style>
html,body{margin:0;background:#0A0A0C}
.card{width:1200px;height:630px;position:relative;overflow:hidden;background:#23408F;color:#fff;font-family:Montserrat,Arial,sans-serif;display:grid;grid-template-columns:1fr 430px}
.l{padding:56px 0 48px 64px;display:flex;flex-direction:column}
.logo{background:#fff;padding:14px 18px;align-self:flex-start}
.logo img{height:46px;display:block}
h1{font-weight:800;font-size:68px;line-height:1.02;letter-spacing:-.025em;margin:48px 0 0}
h1 em{font-family:"Libre Caslon Text",Georgia,serif;font-style:italic;font-weight:400;color:#C9D4F2}
.regs{margin-top:auto;display:flex;gap:10px;font:500 15px "IBM Plex Mono",monospace;letter-spacing:.04em;color:#DCE3F5}
.regs span{border:1px solid rgba(255,255,255,.3);padding:7px 11px}
.r{position:relative;background:#fff}
.r img.ph{width:100%;height:100%;object-fit:cover;display:block}
.pipes{position:absolute;left:0;right:0;bottom:0;display:grid;gap:6px;padding:0}
.pipes i{display:block;height:6px}
.tag{position:absolute;right:20px;top:20px;background:#0A0A0C;color:#EFECE4;font:600 15px "Space Grotesk",sans-serif;padding:10px 14px;display:flex;gap:9px;align-items:center}
.tag b{width:8px;height:8px;background:#2A47ED;display:block}
.icons{position:absolute;left:64px;bottom:118px;display:flex;gap:22px;align-items:flex-end;opacity:.95}
.icons img{height:48px;filter:brightness(0) invert(1)}
</style></head><body>
<div class="card">
  <div class="l">
    <span class="logo"><img src="img/logo.png" alt=""></span>
    <h1>Right first time<br><em>since 2001.</em></h1>
    <div class="regs"><span>GAS SAFE REGISTERED</span><span>OFTEC</span><span>WORCESTER ACCREDITED</span></div>
  </div>
  <div class="r"><img class="ph" src="img/ph-engineer.webp" alt=""><div class="tag"><b></b>Website concept by BrandBildr</div></div>
  <div class="pipes" style="grid-column:1/-1"><i style="background:#ED1B2E"></i><i style="background:#0A2A6F"></i></div>
</div>
</body></html>
